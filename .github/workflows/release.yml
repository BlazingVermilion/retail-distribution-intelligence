name: Release Airflow runtime
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  offline:
    uses: ./.github/workflows/ci.yml
  dbt:
    uses: ./.github/workflows/dbt.yml
  publication:
    uses: ./.github/workflows/publication.yml
  snapshots:
    uses: ./.github/workflows/snapshots.yml
  airflow:
    uses: ./.github/workflows/airflow.yml
  deliver:
    needs: [offline, dbt, publication, snapshots, airflow]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish only tested release commits on main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - name: Build and smoke-test the local runtime
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/airflow"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build -f airflow/Dockerfile -t "$image:$GITHUB_REF_NAME" -t "$image:sha-$GITHUB_SHA" .
          docker run --rm --entrypoint /opt/airflow/pipeline-venv/bin/python "$image:$GITHUB_REF_NAME" -m pip check
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and pull back the versioned image
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker pull "$IMAGE:$GITHUB_REF_NAME"
          docker run --rm --entrypoint airflow "$IMAGE:$GITHUB_REF_NAME" version
