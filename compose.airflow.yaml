# Layer this file over compose.yaml to join the existing warehouse network.
x-runtime: &runtime
  image: retail-airflow:3.1.7-py312
  environment: &common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "1"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${RDI_AF_JWT:?Run airflow/setup_local.py first}
    AIRFLOW__API__SECRET_KEY: ${RDI_AF_API_KEY:?Run airflow/setup_local.py first}
    AIRFLOW__CORE__FERNET_KEY: ${RDI_AF_FERNET:?Run airflow/setup_local.py first}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: analyst:admin
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${RDI_AF_DB_PASS:?Run airflow/setup_local.py first}@airflow-meta:5432/airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
  volumes: &base-mounts
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow_logs:/opt/airflow/logs
  depends_on:
    airflow-init: {condition: service_completed_successfully}

services:
  airflow-meta:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${RDI_AF_DB_PASS:?Run airflow/setup_local.py first}
    volumes:
      - airflow_meta_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
  airflow-init:
    <<: *runtime
    build: {context: ., dockerfile: airflow/Dockerfile}
    depends_on:
      airflow-meta: {condition: service_healthy}
    command: ["db", "migrate"]
  airflow-api:
    <<: *runtime
    command: ["api-server", "--workers", "1"]
    ports:
      - "127.0.0.1:${RDI_AF_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 5s
      retries: 30
  airflow-dag-processor:
    <<: *runtime
    command: ["dag-processor"]
  airflow-scheduler:
    <<: *runtime
    command: ["scheduler"]
    depends_on:
      airflow-api: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    environment:
      <<: *common-env
      RDI_OLLAMA_URL: ${RDI_OLLAMA_URL:-http://host.docker.internal:11434}
      RDI_REPORT_MODEL: ${RDI_REPORT_MODEL:-qwen2.5:3b}
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      PG_SNAPSHOT_PASSWORD: ${PG_SNAPSHOT_PASSWORD:?Complete step 10B}
      PG_PUBLISHER_PASSWORD: ${PG_PUBLISHER_PASSWORD:?Complete step 10A}
      DBT_ENV_SECRET_PASSWORD: ${DBT_ENV_SECRET_PASSWORD:?Complete step 9}
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
      - ./scripts:/opt/project/scripts:ro
      - ./dbt:/opt/project/dbt
      - "${RDI_RAW_DIR:-./data/raw}:/opt/project/data/raw:ro"
      - ./artifacts:/opt/project/artifacts
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8974/health"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  airflow_meta_data:
  airflow_logs:
